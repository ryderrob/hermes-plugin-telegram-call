[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-user-bridge"
version = "1.0.0"
description = "Run a Telegram user account as a Hermes Agent platform: messages, files, voice notes and voice calls."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "telethon>=1.40,<2",
    "cryptg>=0.4,<1",
    "numpy>=1.24,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
calls = ["py-tgcalls>=2.2,<4", "edge-tts>=6.1,<8", "faster-whisper>=1.0,<2"]

[project.scripts]
tg-user-bridge = "tg_user_bridge.cli:main"

[tool.setuptools]
packages = ["tg_user_bridge"]
